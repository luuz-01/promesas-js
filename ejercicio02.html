<!-- Buscador de naves, ingresar el ID y retornar 5 campos -->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buscador de naves</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/comun.css" />
    <link rel="stylesheet" href="css/naves-star-wars.css" />
  </head>
  <body>
    <!-- CAPA 1: estructura HTML del buscador y sus resultados -->
    <main class="pagina container">
      <section class="tarjeta card shadow-lg">
        <header class="encabezado-card card-header">
          <div class="encabezado-contenido">
            <div>
              <span class="etiqueta-tema">STAR WARS · HANGAR</span>
              <h1>Buscador de naves</h1>
              <p>Consulta los modelos y datos de las naves de la galaxia.</p>
            </div>
            <img src="images/starwars_logo.png"  class="espacio-logo" alt="">
            
          </div>
        </header>
        <div class="card-body">
          <form action="" id="formBuscador" class="formulario">
            <label for="idnave" class="form-label">ID de la nave</label>
            <div class="input-group mb-4">
              <span class="input-group-text">#</span>
              <input
                class="form-control"
                type="text"
                id="idnave"
                placeholder="Ejemplo: 2"
              />
              <button class="btn btn-tema" type="submit">Buscar</button>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="nombre" class="form-label">Nombre</label
                ><input class="form-control" type="text" id="nombre" readonly />
              </div>
              <div class="col-md-6">
                <label for="modelo" class="form-label">Modelo</label
                ><input class="form-control" type="text" id="modelo" readonly />
              </div>
              <div class="col-12">
                <label for="fabricante" class="form-label">Fabricante</label
                ><input
                  class="form-control"
                  type="text"
                  id="fabricante"
                  readonly
                />
              </div>
              <div class="col-md-6">
                <label for="costo" class="form-label">Costo en créditos</label
                ><input class="form-control" type="text" id="costo" readonly />
              </div>
              <div class="col-md-6">
                <label for="personal" class="form-label"
                  >Personal necesario</label
                ><input
                  class="form-control"
                  type="text"
                  id="personal"
                  readonly
                />
              </div>
            </div>
          </form>
        </div>
      </section>
    </main>

    <script>
      // CAPA 2: referencias a los elementos y evento de búsqueda.
      const formulario = document.getElementById("formBuscador");
      const id = document.getElementById("idnave");
      const nombre = document.getElementById("nombre");
      const modelo = document.getElementById("modelo");
      const fabricante = document.getElementById("fabricante");
      const costo = document.getElementById("costo");
      const personal = document.getElementById("personal");

      formulario.addEventListener("submit", (event) => {
        event.preventDefault();
        obtenerNave(id.value);
      });

      // CAPA 3: consulta la API de Star Wars y revisa la respuesta.
      async function obtenerNave(id) {
        const API_URL = `https://swapi.dev/api/starships/${id}`;

        try {
          const respuesta = await fetch(API_URL);

          if (!respuesta.ok) {
            nombre.value = "";
            modelo.value = "";
            fabricante.value = "";
            costo.value = "";
            personal.value = "";

            alert("No existe esta nave");
            return;
          }

          const datos = await respuesta.json();

          // CAPA 4: coloca los datos recibidos en los campos del formulario.
          nombre.value = datos.name;
          modelo.value = datos.model;
          fabricante.value = datos.manufacturer;
          costo.value = datos.cost_in_credits;
          personal.value = datos.crew;
        } catch (e) {
          console.error(e);
        }
      }
    </script>
  </body>
</html>
