<!-- Ejercicio 03: Buscador de personajes de Dragon Ball -->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buscador de personajes de Dragon Ball</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/comun.css" />
    <link rel="stylesheet" href="css/personajes-dragon-ball.css" />
  </head>

  <body>
    <!-- CAPA 1: estructura HTML del buscador, resultados e imagen -->
    <main class="pagina container">
      <section class="tarjeta card shadow-lg">
        <header class="encabezado-card card-header">
          <div class="encabezado-contenido">
            <div>
              <span class="etiqueta-tema">DRAGON BALL · GUERREROS</span>
              <h1>Buscador de personajes</h1>
              <p>Escribe el ID para descubrir información del personaje.</p>
            </div>
            <img
              src="images/Dragon_Ball_Z_Logo.png"
              class="espacio-logo"
              alt=""
            />
          </div>
        </header>
        <div class="card-body">
          <form id="formBuscador" class="formulario">
            <label for="idpersonaje" class="form-label">ID del personaje</label>
            <div class="input-group mb-4">
              <span class="input-group-text">#</span>
              <input
                class="form-control"
                type="text"
                id="idpersonaje"
                placeholder="Ejemplo: 2"
              />
              <button class="btn btn-tema" type="submit">Buscar</button>
            </div>
            <div class="row g-3 align-items-start">
              <div class="col-12">
                <label for="nombre" class="form-label">Nombre</label
                ><input class="form-control" type="text" id="nombre" readonly />
              </div>
              <div class="col-md-7">
                <label for="descripcion" class="form-label">Descripción</label
                ><textarea
                  class="form-control"
                  id="descripcion"
                  rows="5"
                  readonly
                ></textarea>
              </div>
              <div class="col-md-5">
                <span class="form-label d-block">Imagen del personaje</span>
                <div class="marco-imagen">
                  <img
                    id="imagen"
                    alt="La imagen del personaje aparecerá aquí"
                  />
                </div>
              </div>
            </div>
          </form>
        </div>
      </section>
    </main>

    <script>
      // CAPA 2: referencias a los elementos y evento de búsqueda.
      const formulario = document.getElementById("formBuscador");
      const idPersonaje = document.getElementById("idpersonaje");
      const nombre = document.getElementById("nombre");
      const descripcion = document.getElementById("descripcion");
      const imagen = document.getElementById("imagen");

      formulario.addEventListener("submit", (event) => {
        event.preventDefault();
        obtenerPersonaje(idPersonaje.value.trim());
      });

      // CAPA 3: limpia los resultados si el personaje no existe.
      function limpiarCampos() {
        nombre.value = "";
        descripcion.value = "";
        imagen.removeAttribute("src");
        imagen.alt = "No se encontró el personaje";
      }

      // CAPA 4: consulta la API y muestra los datos y la imagen recibidos.
      async function obtenerPersonaje(id) {
        if (!id) {
          alert("Escribe el ID de un personaje.");
          return;
        }

        const API_URL = `https://dragonball-api.com/api/characters/${id}`;

        try {
          const respuesta = await fetch(API_URL);

          if (!respuesta.ok) {
            limpiarCampos();
            alert("No se encontró este personaje.");
            return;
          }

          const datos = await respuesta.json();

          nombre.value = datos.name || "";
          descripcion.value = datos.description || "";
          imagen.src = datos.image || "";
          imagen.alt = `Imagen de ${datos.name || "personaje"}`;
        } catch (error) {
          console.error(error);
          limpiarCampos();
          alert("No se pudo conectar con la API.");
        }
      }
    </script>
  </body>
</html>
